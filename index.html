<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesta Econômica Fortaleza</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #1b4332;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .container {
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-title {
      font-size: 17px;
      font-weight: bold;
      color: #1b4332;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .item-giro {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    .baixa {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .alta {
      background-color: #ffebee;
      color: #c62828;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 2px solid #2d6a4f;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }
    button.btn-buscar {
      background-color: #2d6a4f;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .resultado-card {
      border: 1px solid #cce3de;
      background-color: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      text-align: left;
    }
  </style>
</head>
<body>

  <!-- Topo do App -->
  <div class="header">
    🛒 Cesta Econômica Fortaleza
  </div>

  <div class="container">
    
    <!-- Giro de Preços da Semana -->
    <div class="card">
      <div class="card-title">
        📊 Giro de Preços da Semana
      </div>
      
      <div class="item-giro baixa">
        <span>🔻 Manga Tommy (Safra Regional)</span>
        <strong>-30%</strong>
      </div>
      
      <div class="item-giro baixa">
        <span>🔻 Ovos de Granja (Cometa / São Luiz)</span>
        <strong>-12%</strong>
      </div>
      
      <div class="item-giro alta">
        <span>🔺 Tomate Longa Vida (Safra afetada)</span>
        <strong>+22%</strong>
      </div>
      
      <div class="item-giro alta">
        <span>🔺 Carne Bovina (Acém) (Alta de mercado)</span>
        <strong>+15%</strong>
      </div>
    </div>

    <!-- Campo de Busca -->
    <div class="card">
      <div class="card-title">
        🔍 Digite o produto que quer comparar:
      </div>
      
      <div class="search-box">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Ex: Arroz, Feijão, Leite..." 
          onkeypress="tratarEnter(event)"
        />
        <button class="btn-buscar" onclick="pesquisarProduto()">Buscar</button>
      </div>

      <!-- Onde aparecem os resultados da busca -->
      <div id="resultados"></div>
    </div>

  </div>

  <script>
    const produtos = [
      { nome: "Arroz", precoCometa: "R$ 4,89", precoSaoLuiz: "R$ 5,29", precoCenterbox: "R$ 4,99", precoFrangolandia: "R$ 5,10", dicaNutri: "Opte pelo arroz integral para maior aporte de fibras e menor impacto glicémico." },
      { nome: "Feijão", precoCometa: "R$ 7,50", precoSaoLuiz: "R$ 7,90", precoCenterbox: "R$ 7,20", precoFrangolandia: "R$ 7,49", dicaNutri: "Excelente fonte de ferro vegetal e proteínas quando combinado com o arroz." },
      { nome: "Leite", precoCometa: "R$ 4,50", precoSaoLuiz: "R$ 4,80", precoCenterbox: "R$ 4,49", precoFrangolandia: "R$ 4,60", dicaNutri: "Ótima fonte de cálcio e proteínas de alto valor biológico." }
    ];

    function pesquisarProduto() {
      const termo = document.getElementById('searchInput').value.toLowerCase().trim();
      const conteinerResultados = document.getElementById('resultados');
      
      if (!termo) {
        conteinerResultados.innerHTML = "<p style='color: #c62828; margin-top: 12px;'>Digite o nome de um produto para pesquisar.</p>";
        return;
      }

      const resultadosEncontrados = produtos.filter(p => p.nome.toLowerCase().includes(termo));

      if (resultadosEncontrados.length === 0) {
        conteinerResultados.innerHTML = `<p style='color: #666; margin-top: 12px;'>Nenhum produto encontrado para "<strong>${termo}</strong>". Tente buscar por 'Arroz', 'Feijão' ou 'Leite'.</p>`;
        return;
      }

      let htmlResultados = "";
      resultadosEncontrados.forEach(prod => {
        htmlResultados += `
          <div class="resultado-card">
            <h3 style="color: #1b4332; margin-top: 0;">📦 ${prod.nome}</h3>
            <p style="margin: 4px 0;">🛒 <strong>Cometa:</strong> ${prod.precoCometa}</p>
            <p style="margin: 4px 0;">🛒 <strong>Mercadão São Luiz:</strong> ${prod.precoSaoLuiz}</p>
            <p style="margin: 4px 0;">🛒 <strong>Centerbox:</strong> ${prod.precoCenterbox}</p>
            <p style="margin: 4px 0;">🛒 <strong>Frangolândia:</strong> ${prod.precoFrangolandia}</p>
            <hr style="border: 0; border-top: 1px solid #ddd; margin: 10px 0;">
            <p style="color: #2d6a4f; font-size: 14px; margin: 0;">💡 <strong>Dica da Nutri:</strong> ${prod.dicaNutri}</p>
          </div>
        `;
      });

      conteinerResultados.innerHTML = htmlResultados;
    }

    function tratarEnter(event) {
      if (event.key === 'Enter') {
        pesquisarProduto();
      }
    }
  </script>
</body>
</html>Copie todo o código acima.
