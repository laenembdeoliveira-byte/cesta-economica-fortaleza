<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cesta Econômica Fortaleza</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #1b4332;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .container {
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-title {
      font-size: 17px;
      font-weight: bold;
      color: #1b4332;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .item-giro {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    .baixa {
      background-color: #e8f5e9;
      color: #2e7d32;
    }
    .alta {
      background-color: #ffebee;
      color: #c62828;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 2px solid #2d6a4f;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }
    button.btn-buscar {
      background-color: #2d6a4f;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .resultado-card {
      border: 1px solid #cce3de;
      background-color: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      text-align: left;
    }
  </style>
</head>
<body>

  <!-- Topo do App -->
  <div class="header">
    🛒 Cesta Econômica Fortaleza
  </div>

  <div class="container">
    
    <!-- Giro de Preços da Semana -->
    <div class="card">
      <div class="card-title">
        📊 Giro de Preços da Semana
      </div>
      
      <div class="item-giro baixa">
        <span>🔻 Manga Tommy (Safra Regional)</span>
        <strong>-30%</strong>
      </div>
      
      <div class="item-giro baixa">
        <span>🔻 Ovos de Granja (Cometa / São Luiz)</span>
        <strong>-12%</strong>
      </div>
      
      <div class="item-giro alta">
        <span>🔺 Tomate Longa Vida (Safra afetada)</span>
        <strong>+22%</strong>
      </div>
      
      <div class="item-giro alta">
        <span>🔺 Carne Bovina (Acém) (Alta de mercado)</span>
        <strong>+15%</strong>
      </div>
    </div>

    <!-- Campo de Busca -->
    <div class="card">
      <div class="card-title">
        🔍 Digite o produto que quer comparar:
      </div>
      
      <div class="search-box">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Ex: Penne, Espaguete, Feijão..." 
          onkeypress="tratarEnter(event)"
        />
        <button class="btn-buscar" onclick="pesquisarProduto()">Buscar</button>
      </div>

      <!-- Onde aparecem os resultados da busca -->
      <div id="resultados"></div>
    </div>

  </div>

  <script>
    // Catálogo detalhado de insumos
    const produtos = [
      // ARROZ
      { nome: "Arroz Branco Tipo 1 (1kg)", precoCometa: "R$ 4,89", precoSaoLuiz: "R$ 5,29", precoCenterbox: "R$ 4,99", precoFrangolandia: "R$ 5,10", dicaNutri: "Rico em amido e rápido suporte energético. Combine com vegetais folhosos para equilibrar a carga glicêmica." },
      { nome: "Arroz Integral (1kg)", precoCometa: "R$ 6,50", precoSaoLuiz: "R$ 6,90", precoCenterbox: "R$ 6,30", precoFrangolandia: "R$ 6,70", dicaNutri: "Excelente aporte de fibras e minerais (magnésio e fósforo). Auxilia no controle do colesterol e saciedade." },
      { nome: "Arroz Parboilizado (1kg)", precoCometa: "R$ 5,20", precoSaoLuiz: "R$ 5,60", precoCenterbox: "R$ 5,15", precoFrangolandia: "R$ 5,40", dicaNutri: "Passa por processo hidrotérmico que retém as vitaminas do complexo B dentro do grão." },

      // FEIJÃO
      { nome: "Feijão Carioca (1kg)", precoCometa: "R$ 7,50", precoSaoLuiz: "R$ 7,90", precoCenterbox: "R$ 7,20", precoFrangolandia: "R$ 7,49", dicaNutri: "Ótima fonte de proteína vegetal e ferro não-heme. Consuma junto com frutas cítricas para aumentar a absorção do ferro." },
      { nome: "Feijão Preto (1kg)", precoCometa: "R$ 7,90", precoSaoLuiz: "R$ 8,30", precoCenterbox: "R$ 7,80", precoFrangolandia: "R$ 8,10", dicaNutri: "Rico em antioxidantes como antocianinas. Lembre-se do remolho mínimo de 12 horas para eliminar fitatos." },
      { nome: "Feijão de Corda / Macáçar (1kg)", precoCometa: "R$ 8,20", precoSaoLuiz: "R$ 8,60", precoCenterbox: "R$ 8,00", precoFrangolandia: "R$ 8,40", dicaNutri: "Tradicional e muito magro em gorduras. Excelente densidade nutricional para marmitas da semana." },

      // MASSAS / MACARRÃO
      { nome: "Macarrão Espaguete Sêmola (500g)", precoCometa: "R$ 3,49", precoSaoLuiz: "R$ 3,89", precoCenterbox: "R$ 3,39", precoFrangolandia: "R$ 3,69", dicaNutri: "Massa versátil de rápida preparação. Sirva com molho de tomate natural enriquecido com ervas." },
      { nome: "Macarrão Espaguete Integral (500g)", precoCometa: "R$ 4,90", precoSaoLuiz: "R$ 5,40", precoCenterbox: "R$ 4,80", precoFrangolandia: "R$ 5,10", dicaNutri: "Preserva a fibra do trigo. Promove absorção mais lenta de glicose, evitando picos de insulina." },
      { nome: "Macarrão Penne Sêmola (500g)", precoCometa: "R$ 3,59", precoSaoLuiz: "R$ 3,99", precoCenterbox: "R$ 3,49", precoFrangolandia: "R$ 3,75", dicaNutri: "O formato curto retém melhor molhos de vegetais e carnes magras moídas (como patinho)." },
      { nome: "Macarrão Penne Integral (500g)", precoCometa: "R$ 5,10", precoSaoLuiz: "R$ 5,50", precoCenterbox: "R$ 4,99", precoFrangolandia: "R$ 5,25", dicaNutri: "Opção excelente para saladas frias de macarrão com legumes picados e fonte proteica." },

      // OLEOS E GORDURAS
      { nome: "Óleo de Soja (900ml)", precoCometa: "R$ 6,29", precoSaoLuiz: "R$ 6,69", precoCenterbox: "R$ 6,19", precoFrangolandia: "R$ 6,45", dicaNutri: "Fonte de ácidos graxos poli-insaturados. Utilize com moderação na cocção diária." },
      { nome: "Azeite de Oliva Extra Virgem (500ml)", precoCometa: "R$ 38,90", precoSaoLuiz: "R$ 41,90", precoCenterbox: "R$ 37,90", precoFrangolandia: "R$ 39,50", dicaNutri: "Rico em gorduras monoinsaturadas e compostos fenólicos. Ideal para finalizar pratos frios e saladas." },

      // LATICÍNIOS
      { nome: "Leite Integral (1L)", precoCometa: "R$ 4,50", precoSaoLuiz: "R$ 4,80", precoCenterbox: "R$ 4,49", precoFrangolandia: "R$ 4,60", dicaNutri: "Fonte completa de cálcio e proteínas. Mantém a gordura natural importante para absorção de vitaminas lipossolúveis (A, D, E, K)." },
      { nome: "Leite Desnatado (1L)", precoCometa: "R$ 4,60", precoSaoLuiz: "R$ 4,90", precoCenterbox: "R$ 4,55", precoFrangolandia: "R$ 4,70", dicaNutri: "Mesmo teor proteico e de cálcio do integral, mas com teor de gordura reduzido a quase zero." }
    ];

    function pesquisarProduto() {
      const termo = document.getElementById('searchInput').value.toLowerCase().trim();
      const conteinerResultados = document.getElementById('resultados');
      
      if (!termo) {
        conteinerResultados.innerHTML = "<p style='color: #c62828; margin-top: 12px;'>Digite o nome de um produto para pesquisar.</p>";
        return;
      }

      const resultadosEncontrados = produtos.filter(p => p.nome.toLowerCase().includes(termo));

      if (resultadosEncontrados.length === 0) {
        conteinerResultados.innerHTML = `<p style='color: #666; margin-top: 12px;'>Nenhum produto encontrado para "<strong>${termo}</strong>". Tente buscar por 'penne', 'espaguete' ou 'arroz'.</p>`;
        return;
      }

      let htmlResultados = "";
      resultadosEncontrados.forEach(prod => {
        htmlResultados += `
          <div class="resultado-card">
            <h3 style="color: #1b4332; margin-top: 0;">📦 ${prod.nome}</h3>
            <p style="margin: 4px 0;">🛒 <strong>Cometa:</strong> ${prod.precoCometa}</p>
            <p style="margin: 4px 0;">🛒 <strong>Mercadão São Luiz:</strong> ${prod.precoSaoLuiz}</p>
            <p style="margin: 4px 0;">🛒 <strong>Centerbox:</strong> ${prod.precoCenterbox}</p>
            <p style="margin: 4px 0;">🛒 <strong>Frangolândia:</strong> ${prod.precoFrangolandia}</p>
            <hr style="border: 0; border-top: 1px solid #ddd; margin: 10px 0;">
            <p style="color: #2d6a4f; font-size: 14px; margin: 0;">💡 <strong>Dica da Nutri:</strong> ${prod.dicaNutri}</p>
          </div>
        `;
      });

      conteinerResultados.innerHTML = htmlResultados;
    }

    function tratarEnter(event) {
      if (event.key === 'Enter') {
        pesquisarProduto();
      }
    }
  </script>
</body>
</html>
